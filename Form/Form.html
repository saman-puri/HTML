<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" type="text/css" href="form_style.css">
</head>
<body>
  <h1>Job Application Form</h1>
  <form action="https://postman-echo.com/post" method="post">

    <div> 
       <label for="Name">Full Name:</label>
       <input type="text" id="Name" name="name" placeholder="Your Full Name">

    </div>

    <div> 
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Type your Email">
    </div>

    <div>
        <label for="Position">Job Position:</label>
        <select id="Position" name="Position">
          <option value="">--Select a Position--</option>
          <option value="cleaner">Cleaner</option>
          <option value="shop-assistant">Shop Assistant</option>
          <option value="Kitchen-Helper">Kitchen-Helper</option>
          <option value="Warehouse">Warehouse Worker</option>
          </select>    
    </div>

    <div>
        <label for="Expirence">Work Expirence:</label>
        <textarea id="Expirence" name="Expirence" rows="5" placeholder="Describe your working Experience in a small sentence."></textarea>
    </div>

    <div class="checkbox-container">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the terms and conditions</label>
        
    </div>

    <div>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </div>

  </form>
</body>
</html>
